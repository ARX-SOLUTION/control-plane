version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cp_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-audit:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane_audit
      POSTGRES_USER: ${POSTGRES_AUDIT_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:?required}
    volumes:
      - pgdata-audit:/var/lib/postgresql/data
    networks:
      - cp_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_AUDIT_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - cp_internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-alpine
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cp_internal
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: builder
    command:
      - sh
      - -c
      - >
        npx drizzle-kit migrate --config drizzle.config.ts &&
        npx drizzle-kit migrate --config drizzle.config.audit.ts
    env_file: .env.prod
    networks:
      - cp_internal
    depends_on:
      postgres:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env.prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    group_add:
      - "${DOCKER_GID:-112}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cp_internal
      - cp_ingress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

networks:
  cp_internal:
    internal: true
  cp_ingress:

volumes:
  pgdata:
  pgdata-audit:
  redisdata:
  rabbitmqdata:
  appdata:
